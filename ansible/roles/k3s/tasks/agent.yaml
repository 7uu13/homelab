---
- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: not k3s_binary.stat.exists

- name: Wait for server to be ready
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/token
    timeout: 300
  delegate_to: "{{ groups['k3s_servers'][0] }}"

- name: Get K3s token from server
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/token
  register: k3s_token_raw
  delegate_to: "{{ groups['k3s_servers'][0] }}"

- name: Set K3s token fact
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

- name: Install K3s agent
  ansible.builtin.shell: |
    INSTALL_K3S_VERSION={{ k3s_version }} \
    K3S_URL=https://{{ hostvars[groups['k3s_servers'][0]]['ansible_default_ipv4']['address'] }}:6443 \
    K3S_TOKEN={{ k3s_token }} \
    sh /tmp/k3s-install.sh agent
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists
  register: k3s_agent_installed

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Ensure K3s agent service is enabled and started
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: yes
    state: started
