k3s_version: v1.28.3+k3s1
k3s_server_config:
  disable: "traefik,servicelb"
  write-kubeconfig-mode: "0644"
  cluster-cidr: "10.42.0.0/16"
  service-cidr: "10.43.0.0/16"

# Nginx ingress controller
k3s_install_nginx_ingress: true
nginx_ingress_version: v1.9.4

# ArgoCD
k3s_install_argocd: true
argocd_version: v2.9.3
argocd_namespace: argocd
argocd_hostname: ""  # Set to your domain (e.g., argo.tuunikala.com) to create ingress
argocd_ingress_class: nginx
argocd_insecure: false  # Set to true when using ingress with external TLS termination
